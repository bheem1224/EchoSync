# A generic, single database configuration.

[alembic]
prepend_sys_path = .
path_separator = os
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

[alembic:config]
script_location = database/migrations/config
prepend_sys_path = .
path_separator = os
version_path_separator = os

[alembic:working]
script_location = database/migrations/working
prepend_sys_path = .
path_separator = os
version_path_separator = os

[alembic:music]
script_location = database/migrations/music
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = NOTSET
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
