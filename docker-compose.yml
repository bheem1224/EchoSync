version: "3.8"

services:
  echosync:
    image: ghcr.io/bheem1224/echosync:latest # Or 'build: .' if building locally
    container_name: echosync
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=America/New_York

      # ⚠️ CRITICAL: AES Encryption Key for config.db secrets.
      # Generate a secure string (e.g., `openssl rand -base64 32`) and paste it here.
      # DO NOT lose this key, or you will lose access to your connected accounts.
      - MASTER_KEY=YOUR_SECURE_BASE64_KEY_HERE

      # API Server Config
      - UVICORN_PORT=5000
      - ECHOSYNC_CONFIG_DIR=/config
      - ECHOSYNC_DATA_DIR=/data

    ports:
      - "5000:5000" # Main Web UI & API
      - "5001:5001" # Local Network OAuth Callback (Spotify/Tidal)

    volumes:
      # Application Configuration & Databases
      - /path/to/your/appdata/echosync/config:/config
      - /path/to/your/appdata/echosync/data:/data

      # Media & Downloads (Mounted separately to avoid shadowing /data)
      - /path/to/your/library:/library
      - /path/to/your/downloads:/downloads

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
