name: Auto-Version & Build Plugins

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_all:
        description: "Force Rebuild ALL Plugins"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  version-and-build:
    runs-on: [self-hosted, linux, x64]
    if: "!contains(github.event.head_commit.message, 'chore(plugins)')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to diff feature branches against main
          token: ${{ secrets.COMMIT_PAT }}
          persist-credentials: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.COMMIT_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Git Authentication
        run: |
          git config --global url."https://x-access-token:${{ secrets.COMMIT_PAT }}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process, Version, and Build Changed Plugins
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          IS_BUILD_ALL: ${{ github.event.inputs.build_all }}
        run: |
          # --- UNIFIED GLOBAL RELEASE DETECTION ---
          if [[ "$IS_BUILD_ALL" == "true" ]]; then
            echo "🚀 Force Build ALL Plugins requested."
            CHANGED_DIRS=$(find plugins/EchoSync -mindepth 1 -maxdepth 1 -type d)
            IS_GLOBAL_RELEASE="false"
            GLOBAL_VERSION="0.0.0"
          elif echo "$COMMIT_MSG" | grep -qiE 'version:\s*v[0-9]+\.[0-9]+\.[0-9]+'; then
            GLOBAL_VERSION=$(echo "$COMMIT_MSG" | grep -ioE 'version:\s*v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 | sed -E 's/version:\s*v?//i')
            echo "🚀 Global Release detected (v$GLOBAL_VERSION). Syncing ALL plugins."
            CHANGED_DIRS=$(find plugins/EchoSync -mindepth 1 -maxdepth 1 -type d)
            IS_GLOBAL_RELEASE="true"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "🔍 Manual trigger on feature branch. Detecting changed plugins relative to main."
            git fetch origin main
            CHANGED_DIRS=$(git diff --name-only origin/main...HEAD | grep '^plugins/EchoSync/' | cut -d/ -f1,2,3 | sort -u)
            IS_GLOBAL_RELEASE="false"
            GLOBAL_VERSION="0.0.0"
          else
            echo "🔍 Incremental commit. Detecting changed plugins for beta build."
            CHANGED_DIRS=$(git diff --name-only HEAD^ HEAD | grep '^plugins/EchoSync/' | cut -d/ -f1,2,3 | sort -u)
            IS_GLOBAL_RELEASE="false"
            GLOBAL_VERSION="0.0.0"
          fi

          if [ -z "$CHANGED_DIRS" ]; then
            echo "ℹ️ No plugin changes detected. Skipping build."
            exit 0
          fi

          # --- SAFELY WRITE PYTHON SCRIPT TO DISK ---
          cat << 'EOF' > raw_bump.py
          import sys, json, re

          plugin_name = sys.argv[1]
          manifest_path = sys.argv[2]
          commit_msg = sys.argv[3]
          is_global_release = sys.argv[4]
          global_version = sys.argv[5]

          with open(manifest_path, "r") as f:
              manifest = json.load(f)

          author = manifest.get("author", "EchoSync")
          name = manifest.get("name", plugin_name)
          manifest["id"] = f"{author}.{name}"

          current_version = manifest.get("version", "0.0.0")
          major, minor, patch = map(int, current_version.split("."))

          build_type = "beta"
          override_match = re.search(rf"{plugin_name}:v(\d+\.\d+\.\d+)", commit_msg, re.IGNORECASE)

          if override_match:
              new_version = override_match.group(1)
              build_type = "stable"
              manifest["version"] = new_version
          elif is_global_release == "true":
              new_version = global_version
              build_type = "stable"
              manifest["version"] = new_version
          else:
              current_beta = manifest.get("beta_version", f"{major}.{minor}.{patch+1}-beta.0")
              try:
                  beta_num = int(current_beta.split("beta.")[-1]) + 1
              except:
                  beta_num = 1
              new_version = f"{major}.{minor}.{patch+1}-beta.{beta_num}"
              build_type = "beta"
              manifest["beta_version"] = new_version

          with open(manifest_path, "w") as f:
              json.dump(manifest, f, indent=2)

          print(f"{build_type},{new_version}")
          EOF

          python3 -c "import textwrap; open('bump.py', 'w').write(textwrap.dedent(open('raw_bump.py').read()))"

          for DIR in $CHANGED_DIRS; do
            PLUGIN_NAME=$(basename "$DIR")
            MANIFEST="$DIR/manifest.json"
            UI_DIR="$DIR/ui"
            STATIC_DIR="$DIR/static"

            if [ ! -f "$MANIFEST" ]; then
              continue
            fi

            echo "========================================"
            echo "⚙️ Processing Plugin: $PLUGIN_NAME"
            echo "========================================"

            RESULT=$(python3 bump.py "$PLUGIN_NAME" "$MANIFEST" "$COMMIT_MSG" "$IS_GLOBAL_RELEASE" "$GLOBAL_VERSION")
            BUILD_TYPE=$(echo "$RESULT" | cut -d',' -f1)
            NEW_VERSION=$(echo "$RESULT" | cut -d',' -f2)

            echo "✅ Manifest updated to $NEW_VERSION ($BUILD_TYPE build)"

            if [ -d "$UI_DIR" ]; then
              mkdir -p "$STATIC_DIR"
              cd "$UI_DIR"
              
              if [ ! -f "package.json" ]; then
                npm init -y > /dev/null
                npm pkg set scripts.build="vite build"
              fi

              npm install
              npm install vite svelte @sveltejs/vite-plugin-svelte --no-save
              npm run build
              cd ../../../../
              echo "📦 UI Compiled to bundle.js"
            fi

            cd "$DIR"
            
            # Strip dev_mode key from manifest before packaging
            if [ -f "manifest.json" ]; then
              jq 'del(.dev_mode)' manifest.json > tmp.json && mv tmp.json manifest.json
            fi

            if [ "$BUILD_TYPE" = "stable" ]; then
              mkdir -p "releases"
              DYNAMIC_ZIP_NAME="v${NEW_VERSION}.zip"
              zip -r "releases/$DYNAMIC_ZIP_NAME" . -x "ui/*" -x "src/*" -x "target/*" -x "releases/*" -x "beta.zip" -x "*/__pycache__/*"
            else
              rm -f "beta.zip"
              zip -r "beta.zip" . -x "ui/*" -x "src/*" -x "target/*" -x "releases/*" -x "*/__pycache__/*"
            fi
            cd ../../../
          done

      - name: Generate store-manifest.json
        run: |
          cat << 'EOF' > raw_manifest.py
          import glob, json, os

          store_manifest = {"plugins": []}
          repo_base = "https://raw.githubusercontent.com/bheem1224/EchoSync/main/plugins/EchoSync"

          for manifest_file in glob.glob("plugins/EchoSync/*/manifest.json"):
              with open(manifest_file, "r") as f:
                  try:
                      plugin_data = json.load(f)
                      folder_name = os.path.basename(os.path.dirname(manifest_file))
                      
                      author = plugin_data.get("author", "EchoSync")
                      name = plugin_data.get("name", folder_name)
                      plugin_data["id"] = f"{author}.{name}"
                      plugin_data["plugin_id"] = folder_name
                      plugin_data["source_url"] = f"https://github.com/bheem1224/EchoSync/tree/main/plugins/EchoSync/{folder_name}"
                      
                      stable_version = plugin_data.get("version", "0.0.0")
                      plugin_data["download_url"] = f"{repo_base}/{folder_name}/releases/v{stable_version}.zip"
                      plugin_data["beta_url"] = f"{repo_base}/{folder_name}/beta.zip"
                      
                      store_manifest["plugins"].append(plugin_data)
                  except Exception as e:
                      pass
                      
          with open("plugins/store-manifest.json", "w") as f:
              json.dump(store_manifest, f, indent=2)
          EOF
          python3 -c "import textwrap; open('manifest.py', 'w').write(textwrap.dedent(open('raw_manifest.py').read()))"
          python3 manifest.py

      - name: Artifact Airlift to Main
        run: |
          echo "📦 Isolating Beta Artifacts and Manifests..."
          mkdir -p /tmp/artifacts/plugins/EchoSync
          cp plugins/store-manifest.json /tmp/artifacts/plugins/ || true

          for DIR in plugins/EchoSync/*; do
            if [ -d "$DIR" ]; then
              PLUGIN=$(basename "$DIR")
              mkdir -p "/tmp/artifacts/plugins/EchoSync/$PLUGIN"
              [ -f "$DIR/beta.zip" ] && cp "$DIR/beta.zip" "/tmp/artifacts/plugins/EchoSync/$PLUGIN/"
              [ -f "$DIR/manifest.json" ] && cp "$DIR/manifest.json" "/tmp/artifacts/plugins/EchoSync/$PLUGIN/"
              [ -f "$DIR/ui_manifest.json" ] && cp "$DIR/ui_manifest.json" "/tmp/artifacts/plugins/EchoSync/$PLUGIN/"
              [ -d "$DIR/releases" ] && cp -r "$DIR/releases" "/tmp/artifacts/plugins/EchoSync/$PLUGIN/"
            fi
          done

          echo "🔄 Violently Checking Out Main Branch..."
          git fetch origin main
          git checkout main
          git pull origin main

          echo "📥 Pushing Artifacts to Main workspace..."
          cp -r /tmp/artifacts/plugins/* plugins/

          echo "🚀 Committing Artifacts to Main..."
          git add plugins/

          if git diff --staged --quiet; then
            echo "ℹ️ No artifact changes to commit to main."
          else
            git commit -m "chore(plugins): airlift beta artifacts from ${{ github.ref_name }} [skip ci]"
            git push origin main
            echo "✅ Successfully pushed beta artifacts to main! The source code was untouched."
          fi
