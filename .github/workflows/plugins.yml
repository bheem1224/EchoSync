name: Auto-Version & Build Plugins

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-and-build:
    runs-on: [self-hosted, linux, x64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.COMMIT_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Process, Version, and Build Changed Plugins
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$COMMIT_MSG" == *"[plugin-beta]"* ]] || [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "🚀 Manual trigger or [plugin-beta] override detected. Building ALL plugins."
            CHANGED_DIRS=$(find plugins -mindepth 1 -maxdepth 1 -type d)
          else
            CHANGED_DIRS=$(git diff --name-only HEAD^ HEAD | grep '^plugins/' | cut -d/ -f1,2 | sort -u)
          fi

          if [ -z "$CHANGED_DIRS" ]; then
            echo "ℹ️ No plugin changes detected. Skipping build."
            exit 0
          fi

          for DIR in $CHANGED_DIRS; do
            PLUGIN_NAME=$(basename $DIR)
            MANIFEST="$DIR/manifest.json"
            UI_DIR="$DIR/ui"
            STATIC_DIR="$DIR/static"

            if [ ! -f "$MANIFEST" ]; then
              continue
            fi

            echo "========================================"
            echo "⚙️ Processing Plugin: $PLUGIN_NAME"
            echo "========================================"

            # --- PYTHON VERSIONING LOGIC ---
            RESULT=$(python3 -c '
import sys, json, re

plugin_name = sys.argv[1]
manifest_path = sys.argv[2]
commit_msg = sys.argv[3]

with open(manifest_path, "r") as f:
    manifest = json.load(f)

current_version = manifest.get("version", "0.0.0")
major, minor, patch = map(int, current_version.split("."))

build_type = "beta"
is_stable_release = "[release-plugins]" in commit_msg

override_match = re.search(rf"{plugin_name}:v(\d+\.\d+\.\d+)", commit_msg, re.IGNORECASE)

if override_match:
    new_version = override_match.group(1)
    build_type = "stable"
    manifest["version"] = new_version
elif is_stable_release:
    if patch > 0 or current_version == "0.0.0":
        if minor == 9:
            major += 1
            minor = 0
        else:
            minor += 1
        patch = 0
    new_version = f"{major}.{minor}.{patch}"
    build_type = "stable"
    manifest["version"] = new_version
else:
    # Handle Beta Versioning
    current_beta = manifest.get("beta_version", f"{major}.{minor}.{patch+1}-beta.0")
    try:
        beta_num = int(current_beta.split("beta.")[-1]) + 1
    except:
        beta_num = 1
    new_version = f"{major}.{minor}.{patch+1}-beta.{beta_num}"
    build_type = "beta"
    manifest["beta_version"] = new_version

with open(manifest_path, "w") as f:
    json.dump(manifest, f, indent=2)

print(f"{build_type},{new_version}")
            ' "$PLUGIN_NAME" "$MANIFEST" "$COMMIT_MSG")

            BUILD_TYPE=$(echo "$RESULT" | cut -d',' -f1)
            NEW_VERSION=$(echo "$RESULT" | cut -d',' -f2)

            echo "✅ Manifest updated to $NEW_VERSION ($BUILD_TYPE build)"

            # --- UI BUILD PIPELINE ---
            if [ -d "$UI_DIR" ]; then
              mkdir -p "$STATIC_DIR"
              cd "$UI_DIR"
              
              if [ ! -f "package.json" ]; then
                echo "📦 Initializing temporary Node environment..."
                npm init -y > /dev/null
                npm install svelte @sveltejs/vite-plugin-svelte vite --no-save
                npm pkg set scripts.build="vite build"
              else
                npm install
              fi

              npm run build
              cd ../../../
              echo "📦 UI Compiled to bundle.js"
            fi

            # --- ZIP PACKAGING PIPELINE ---
            cd "$DIR"
            
            if [ "$BUILD_TYPE" = "stable" ]; then
              echo "🗜️ Packaging stable release v$NEW_VERSION..."
              mkdir -p "releases"
              ZIP_NAME="{PLUGIN_VERSION}.zip" # This will literally be replaced with the version number by the app, but let's name it dynamically
              DYNAMIC_ZIP_NAME="v${NEW_VERSION}.zip"
              
              # Zip everything EXCEPT UI source, Rust source, pycache, and beta/release artifacts
              zip -r "releases/$DYNAMIC_ZIP_NAME" . -x "ui/*" -x "src/*" -x "target/*" -x "releases/*" -x "beta.zip" -x "*/__pycache__/*"
              echo "✅ Created stable package: releases/$DYNAMIC_ZIP_NAME"
            else
              echo "🗜️ Packaging beta release..."
              # Remove old beta zip to ensure clean slate
              rm -f "beta.zip"
              zip -r "beta.zip" . -x "ui/*" -x "src/*" -x "target/*" -x "releases/*" -x "*/__pycache__/*"
              echo "✅ Created beta package: beta.zip"
            fi
            
            cd ../../

          done

      - name: Generate store-manifest.json
        run: |
          python3 -c '
          import glob, json
          
          store_manifest = []
          for manifest_file in glob.glob("plugins/*/manifest.json"):
              with open(manifest_file, "r") as f:
                  try:
                      plugin_data = json.load(f)
                      # Inject the plugin ID (folder name) just in case
                      plugin_data["plugin_id"] = manifest_file.split("/")[1]
                      store_manifest.append(plugin_data)
                  except:
                      pass
                      
          with open("store-manifest.json", "w") as f:
              json.dump(store_manifest, f, indent=2)
          '
          echo "✅ store-manifest.json generated successfully."

      - name: Commit Assets Back to Repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(plugins): auto-versioning, release packaging, and store manifest update"
          file_pattern: 'plugins/ store-manifest.json'