name: Auto-Version & Build Plugins

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-and-build:
    runs-on: [self-hosted, linux, x64]
    if: "!contains(github.event.head_commit.message, 'chore(plugins)')"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.COMMIT_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Process, Version, and Build Changed Plugins
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # --- UNIFIED GLOBAL RELEASE DETECTION ---
          if echo "$COMMIT_MSG" | grep -qiE 'version:\s*v[0-9]+\.[0-9]+\.[0-9]+'; then
            # Extracts pure numbers (e.g., "2.5.0") for the JSON manifest
            GLOBAL_VERSION=$(echo "$COMMIT_MSG" | grep -ioE 'version:\s*v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 | sed -E 's/version:\s*v?//i')
            echo "🚀 Global Release detected (v$GLOBAL_VERSION). Syncing ALL plugins."
            CHANGED_DIRS=$(find plugins -mindepth 1 -maxdepth 1 -type d)
            IS_GLOBAL_RELEASE="true"
          elif [[ "$COMMIT_MSG" == *"[plugin-beta]"* ]] || [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "🚀 Manual trigger or [plugin-beta] override. Building ALL plugins as beta."
            CHANGED_DIRS=$(find plugins -mindepth 1 -maxdepth 1 -type d)
            IS_GLOBAL_RELEASE="false"
            GLOBAL_VERSION="0.0.0"
          else
            echo "🔍 Incremental commit. Detecting changed plugins for beta build."
            CHANGED_DIRS=$(git diff --name-only HEAD^ HEAD | grep '^plugins/' | cut -d/ -f1,2 | sort -u)
            IS_GLOBAL_RELEASE="false"
            GLOBAL_VERSION="0.0.0"
          fi

          if [ -z "$CHANGED_DIRS" ]; then
            echo "ℹ️ No plugin changes detected. Skipping build."
            exit 0
          fi

          # --- SAFELY WRITE PYTHON SCRIPT TO DISK ---
          cat << 'EOF' > raw_bump.py
          import sys, json, re

          plugin_name = sys.argv[1]
          manifest_path = sys.argv[2]
          commit_msg = sys.argv[3]
          is_global_release = sys.argv[4]
          global_version = sys.argv[5]

          with open(manifest_path, "r") as f:
              manifest = json.load(f)

          current_version = manifest.get("version", "0.0.0")
          major, minor, patch = map(int, current_version.split("."))

          build_type = "beta"

          override_match = re.search(rf"{plugin_name}:v(\d+\.\d+\.\d+)", commit_msg, re.IGNORECASE)

          # 1. Specific plugin override (e.g., musicbrainz:v1.2.0)
          if override_match:
              new_version = override_match.group(1)
              build_type = "stable"
              manifest["version"] = new_version
          # 2. Global Release Sync
          elif is_global_release == "true":
              new_version = global_version
              build_type = "stable"
              manifest["version"] = new_version
          # 3. Incremental Beta Bump
          else:
              current_beta = manifest.get("beta_version", f"{major}.{minor}.{patch+1}-beta.0")
              try:
                  beta_num = int(current_beta.split("beta.")[-1]) + 1
              except:
                  beta_num = 1
              new_version = f"{major}.{minor}.{patch+1}-beta.{beta_num}"
              build_type = "beta"
              manifest["beta_version"] = new_version

          with open(manifest_path, "w") as f:
              json.dump(manifest, f, indent=2)

          print(f"{build_type},{new_version}")
          EOF

          python3 -c "import textwrap; open('bump.py', 'w').write(textwrap.dedent(open('raw_bump.py').read()))"

          for DIR in $CHANGED_DIRS; do
            PLUGIN_NAME=$(basename $DIR)
            MANIFEST="$DIR/manifest.json"
            UI_DIR="$DIR/ui"
            STATIC_DIR="$DIR/static"

            if [ ! -f "$MANIFEST" ]; then
              continue
            fi

            echo "========================================"
            echo "⚙️ Processing Plugin: $PLUGIN_NAME"
            echo "========================================"

            # Execute Python script with parameters
            RESULT=$(python3 bump.py "$PLUGIN_NAME" "$MANIFEST" "$COMMIT_MSG" "$IS_GLOBAL_RELEASE" "$GLOBAL_VERSION")

            BUILD_TYPE=$(echo "$RESULT" | cut -d',' -f1)
            NEW_VERSION=$(echo "$RESULT" | cut -d',' -f2)

            echo "✅ Manifest updated to $NEW_VERSION ($BUILD_TYPE build)"

            # --- UI BUILD PIPELINE ---
            if [ -d "$UI_DIR" ]; then
              mkdir -p "$STATIC_DIR"
              cd "$UI_DIR"
              
              if [ ! -f "package.json" ]; then
                echo "📦 Initializing temporary Node environment..."
                npm init -y > /dev/null
                npm pkg set scripts.build="vite build"
              fi

              npm install
              echo "📦 Injecting Vite and Svelte compilers..."
              npm install vite svelte @sveltejs/vite-plugin-svelte --no-save

              npm run build
              cd ../../../
              echo "📦 UI Compiled to bundle.js"
            fi

            # --- ZIP PACKAGING PIPELINE ---
            cd "$DIR"
            
            if [ "$BUILD_TYPE" = "stable" ]; then
              echo "🗜️ Packaging stable release v$NEW_VERSION..."
              mkdir -p "releases"
              DYNAMIC_ZIP_NAME="v${NEW_VERSION}.zip"
              
              zip -r "releases/$DYNAMIC_ZIP_NAME" . -x "ui/*" -x "src/*" -x "target/*" -x "releases/*" -x "beta.zip" -x "*/__pycache__/*"
              echo "✅ Created stable package: releases/$DYNAMIC_ZIP_NAME"
            else
              echo "🗜️ Packaging beta release..."
              rm -f "beta.zip"
              zip -r "beta.zip" . -x "ui/*" -x "src/*" -x "target/*" -x "releases/*" -x "*/__pycache__/*"
              echo "✅ Created beta package: beta.zip"
            fi
            cd ../../
          done

      - name: Generate store-manifest.json
        run: |
          cat << 'EOF' > raw_manifest.py
          import glob, json
          
          store_manifest = {"plugins": []}
          repo_base = "https://raw.githubusercontent.com/bheem1224/EchoSync/main/plugins"
          
          for manifest_file in glob.glob("plugins/*/manifest.json"):
              with open(manifest_file, "r") as f:
                  try:
                      plugin_data = json.load(f)
                      folder_name = manifest_file.split("/")[1]
                      
                      plugin_data["plugin_id"] = folder_name
                      plugin_data["source_url"] = f"https://github.com/bheem1224/EchoSync/tree/main/plugins/{folder_name}"
                      
                      stable_version = plugin_data.get("version", "0.0.0")
                      plugin_data["download_url"] = f"{repo_base}/{folder_name}/releases/v{stable_version}.zip"
                      plugin_data["beta_url"] = f"{repo_base}/{folder_name}/beta.zip"
                      
                      store_manifest["plugins"].append(plugin_data)
                  except Exception as e:
                      print(f"Error processing {manifest_file}: {e}")
                      
          with open("plugins/store-manifest.json", "w") as f:
              json.dump(store_manifest, f, indent=2)
          EOF
          python3 -c "import textwrap; open('manifest.py', 'w').write(textwrap.dedent(open('raw_manifest.py').read()))"
          python3 manifest.py
          echo "✅ plugins/store-manifest.json generated successfully."

      - name: Commit Assets Back to Repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(plugins): sync versions, package artifacts, and update store [skip ci]"
          file_pattern: 'plugins/'