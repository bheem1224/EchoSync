name: "Code Security Scanning"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 13 * * 2'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Codebase
    runs-on: [self-hosted, linux, x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    # 📦 STEP A: Explicitly install the UI dependencies so CodeQL has a node tree to read
    - name: Install Frontend Dependencies
      run: |
        if [ -d "webui" ]; then
          cd webui
          npm install
          cd ..
        fi

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'python, javascript' # Tracks both backend and svelte chunks

    # 🚨 STEP B: WE REMOVED THE AUTOBUILD CRASH STEP AND REPLACED IT WITH A CUSTOM COMMAND
    - name: Manual Build Step
      run: |
        echo "Skipping autobuild to prevent root path mismatches. CodeQL will analyze checked-out modules directly."

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3