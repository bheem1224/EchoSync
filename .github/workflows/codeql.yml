name: "Code Security Scanning"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 13 * * 2' # Scans every Tuesday automatically

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Codebase
    runs-on: [self-hosted, linux, x64] # Binds directly to your existing free runner

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'python, javascript' # Targets FastAPI backend and Svelte UI layers explicitly

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
