name: Build and Publish Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Force build without cache"
        required: false
        type: boolean
        default: false
      tag_as_latest:
        description: "Tag as latest in addition to beta"
        required: false
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository (Clean Workspace)
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Tags & Version
        id: extract_tags
        run: |
          BASE_IMAGE="ghcr.io/${{ github.repository_owner }}/echosync"
          
          # Handle commit message safely across push and workflow_dispatch
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          if echo "$COMMIT_MSG" | grep -qiE 'version:\s*v[0-9]+\.[0-9]+\.[0-9]+'; then
            EXTRACTED_VERSION=$(echo "$COMMIT_MSG" | grep -ioE 'version:\s*v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 | sed -E 's/version:\s*//i')
            TAGS="$BASE_IMAGE:$EXTRACTED_VERSION,$BASE_IMAGE:latest,$BASE_IMAGE:beta"
            echo "version=$EXTRACTED_VERSION" >> $GITHUB_OUTPUT
          else
            if [ "${{ github.event.inputs.tag_as_latest }}" == "true" ]; then
              TAGS="$BASE_IMAGE:beta,$BASE_IMAGE:latest"
            else
              TAGS="$BASE_IMAGE:beta"
            fi
            echo "version=" >> $GITHUB_OUTPUT
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

          # Detect no-cache condition
          if echo "$COMMIT_MSG" | grep -qi '\[no-cache\]' || [ "${{ github.event.inputs.no_cache }}" == "true" ]; then
            echo "no_cache=true" >> $GITHUB_OUTPUT
          else
            echo "no_cache=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.extract_tags.outputs.tags }}
          no-cache: ${{ steps.extract_tags.outputs.no_cache == 'true' }}

      - name: Clean Docker Build Cache
        if: always()
        run: docker builder prune --keep-storage 5GB -f