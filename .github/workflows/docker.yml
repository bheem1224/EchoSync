name: Build and Publish Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Force build without cache"
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          
      - name: Purge Zombie Buildx Containers
        run: docker buildx rm -a || true
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Tags & Version
        id: extract_tags
        run: |
          BASE_IMAGE="ghcr.io/${{ github.repository_owner }}/echosync"

          # FIX: Safely retrieve the commit message even during manual workflow_dispatch
          COMMIT_MSG=$(git log -1 --pretty=%B)

          if echo "$COMMIT_MSG" | grep -qiE 'version:\s*v[0-9]+\.[0-9]+\.[0-9]+'; then
            EXTRACTED_VERSION=$(echo "$COMMIT_MSG" | grep -ioE 'version:\s*v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 | sed -E 's/version:\s*//i')
            
            TAGS="$BASE_IMAGE:$EXTRACTED_VERSION,$BASE_IMAGE:latest,$BASE_IMAGE:beta"
            echo "🚀 Global Release detected: $EXTRACTED_VERSION."
            
            RELEASE_TITLE=$(echo "$COMMIT_MSG" | awk 'NR==2')
            if [ -z "$(echo "$RELEASE_TITLE" | tr -d '[:space:]')" ]; then
              RELEASE_TITLE="Release $EXTRACTED_VERSION"
            fi
            
            RELEASE_BODY=$(echo "$COMMIT_MSG" | awk 'NR>2')
            
            echo "version=$EXTRACTED_VERSION" >> $GITHUB_OUTPUT
            echo "title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
            
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$RELEASE_BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            TAGS="$BASE_IMAGE:beta"
            echo "🔍 No explicit version found. Building 'beta' only."
            echo "version=" >> $GITHUB_OUTPUT
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

          # FIX: Evaluate no-cache request reliably
          if echo "$COMMIT_MSG" | grep -qi '\[no-cache\]' || [ "${{ github.event.inputs.no_cache }}" == "true" ]; then
            echo "no_cache=true" >> $GITHUB_OUTPUT
            echo "🚨 No-cache flag detected! Forcing a clean Docker build."
          else
            echo "no_cache=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.extract_tags.outputs.tags }}
          # FIX: Force BuildKit to ignore all layer caches and pull fresh base images
          no-cache: ${{ steps.extract_tags.outputs.no_cache == 'true' }}
          pull: ${{ steps.extract_tags.outputs.no_cache == 'true' }}

      - name: Create GitHub Release
        if: steps.extract_tags.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_tags.outputs.version }}
          name: ${{ steps.extract_tags.outputs.title }}
          body: ${{ steps.extract_tags.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}