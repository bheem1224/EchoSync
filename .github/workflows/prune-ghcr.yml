name: Prune Untagged GHCR Images

on:
  schedule:
    - cron: "0 3 * * *" # Runs nightly at 3:00 AM
  workflow_dispatch: # Manual run trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prune-untagged:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Bulk Delete Untagged Container Images
        env:
          GH_TOKEN: ${{ secrets.CR_PAT }}
          PACKAGE_NAME: echosync
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CR_PAT secret is missing. Deletion requires a classic PAT with 'delete:packages' scope."
            exit 1
          fi

          echo "Fetching untagged image versions for user package '${PACKAGE_NAME}'..."

          # Fetch all untagged version IDs
          UNTAGGED_IDS=$(gh api --paginate "/user/packages/container/${PACKAGE_NAME}/versions" \
            --jq '.[] | select(.metadata.container.tags | length == 0) | .id')

          if [ -z "$UNTAGGED_IDS" ]; then
            echo "No untagged images found. Registry is clean."
            exit 0
          fi

          TOTAL=$(echo "$UNTAGGED_IDS" | wc -w)
          echo "Found ${TOTAL} untagged versions. Pruning..."

          COUNT=0
          FAILURES=0

          for VERSION_ID in $UNTAGGED_IDS; do
            COUNT=$((COUNT + 1))
            echo "[$COUNT/$TOTAL] Deleting version ID: $VERSION_ID"
            
            if gh api --method DELETE "/user/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}" > /dev/null 2>&1; then
              echo "  -> Deleted successfully."
            else
              echo "  -> Warning: Failed to delete $VERSION_ID (skipping)"
              FAILURES=$((FAILURES + 1))
            fi
            
            # 0.25s pause to prevent secondary rate-limit triggers
            sleep 0.25
          done

          echo "Completed prune: $((COUNT - FAILURES)) deleted, ${FAILURES} failed out of ${TOTAL} total."
