[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --maxfail=5 --durations=10"
# Enforce isolation and fail fast on runaway suites
filterwarnings = ["error::ResourceWarning", "ignore::DeprecationWarning"]

[project]
name = "echosync_core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "asyncio-mqtt>=0.16.0",
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "datetime>=6.0",
    "flask>=3.0.0",
    "packaging>=23.0",
    "flask-cors>=4.0.0",
    "lrclibapi>=0.3.1",
    "maturin>=1.11.5",
    "pillow>=10.0.0",
    "plexapi>=4.17.0",
    "psutil>=6.0.0",
    "pyacoustid>=1.3.0",
    "pycryptodome>=3.19.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.22.0",
    "pytest-mock>=3.12.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "retrying>=1.4.2",
    "spotipy>=2.23.0",
    "sqlalchemy>=2.0.0",
    "unidecode>=1.3.8",
    "yt-dlp>=2024.12.13",
    "redis>=4.5.0",
    "rapidfuzz>=3.14.3",
    "watchdog>=4.0.0",
    "werkzeug>=3.0.3",
    "ruamel.yaml>=0.17.0",
    "alembic>=1.18.4",
    "pypinyin>=0.55.0",
    "opencc-python-reimplemented>=0.1.7",
    "pykakasi>=2.3.0",
    "hangul-romanize>=0.1.0",
    "fastapi[standard]>=0.136.1",
    "sse-starlette>=3.4.11",
]

[dependency-groups]
dev = ["ruff>=0.16.6"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Exclude autogenerated migrations, build outputs, and frontend assets
exclude = [".git", ".venv", "__pycache__", "alembic", "webui", "tests"]

[tool.ruff.lint]
# Select essential syntax (E), runtime error (F), and bug prevention (B) rules
select = [
    "E", # pycodestyle errors
    "F", # pyflakes runtime errors / undefined names
    "B", # flake8-bugbear (genuine logic bugs)
    "W", # pycodestyle warnings
]

# Suppress stylistic and non-critical pedantic checks
ignore = [
    "E501",   # Line length handled by formatter
    "BLE001", # Blind except Exception (needed in plugin sandboxing)
    "S110",   # try-except-pass
    "S112",   # try-except-continue
    "G201",   # logging.error(..., exc_info=True) vs .exception()
    "SIM102", # Nested if statements
    "B008",   # FastAPI Depends() in function defaults
]

[tool.ruff.lint.per-file-ignores]
# Relax runtime rules for plugin definitions and migration scripts
"plugins/**" = ["F401", "B006"]
"alembic/**" = ["F401"]

[tool.pyright]
reportAttributeAccessIssue = "none"
reportUnknownMemberType = "none"
reportGeneralTypeIssues = "warning"
reportOptionalMemberAccess = "none"
reportMissingImports = "warning"
