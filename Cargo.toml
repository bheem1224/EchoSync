[package]
name = "echosync_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "echosync_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38"] }
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
walkdir = "2"
lofty = "0.21"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "ogg", "vorbis", "wav", "pcm"] }
rusty-chromaprint = "0.3"
